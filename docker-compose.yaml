services:
  app:
    platform: linux/amd64
    build: 
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:16-alpine
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d/
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:

  